version: '3.8'

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: epigraph-redis-stack
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight UI
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20.0
    container_name: epigraph-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/epigraph_password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j-data:/data
      - neo4j-plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p epigraph_password 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  redis-data:
  neo4j-data:
  neo4j-plugins:
